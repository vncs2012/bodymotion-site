name: Registrar deploy de produção no Rustrak

on:
  repository_dispatch:
    types: [vercel.deployment.success, vercel.deployment.promoted]

permissions:
  contents: read

concurrency:
  group: rustrak-${{ github.event.client_payload.id }}
  cancel-in-progress: false

jobs:
  registrar:
    if: >-
      github.event.client_payload.environment == 'production' &&
      github.event.client_payload.project.id == 'prj_rpRMVkQZqEy4mJTs1F63NikNuTkZ' &&
      github.event.client_payload.git.ref == 'master' &&
      contains(github.event.client_payload.alias, 'www.bodymotion.pro')
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    environment: rustrak-production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Registrar a release e os commits do deploy
        env:
          RUSTRAK_RELEASE_TOKEN: ${{ secrets.RUSTRAK_RELEASE_TOKEN }}
          RUSTRAK_PROJECT_ID: '4'
          RUSTRAK_DEPLOY_SHA: ${{ github.event.client_payload.git.sha }}
          RUSTRAK_DEPLOY_NAME: ${{ github.event.client_payload.id }}
          RUSTRAK_DEPLOY_URL: ${{ github.event.client_payload.url }}
        run: python3 scripts/registrar_deploy_rustrak.py
